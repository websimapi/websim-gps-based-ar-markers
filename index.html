<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>GPS Based AR Markers</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- A-Frame library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for location-based AR (three.js part) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
    <!-- AR.js A-Frame components -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <!-- Overlay instructions -->
    <div id="overlay">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2">
          <animate attributeName="r" values="10;12;10" dur="1s" repeatCount="indefinite" />
          <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite" />
        </circle>
      </svg>
      <span>Move your device to discover GPS markers</span>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
      renderer="antialias: true; alpha: true"
    >
      <!-- The gps-new-camera component uses device sensors to position the AR camera -->
      <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

      <!-- Marker 1: A red box with pulsating animation placed at a sample location.
           Adjust the latitude/longitude to suit your surroundings. -->
      <a-entity
        geometry="primitive: box"
        material="color: red"
        scale="10 10 10"
        gps-new-entity-place="latitude: 37.7749; longitude: -122.4194"
        animation="property: scale; dir: alternate; dur: 1000; loop: true; to: 12 12 12"
      ></a-entity>

      <!-- Marker 2: A blue sphere with a gentle pulsation placed slightly offset from marker 1 -->
      <a-entity
        geometry="primitive: sphere"
        material="color: blue"
        scale="5 5 5"
        gps-new-entity-place="latitude: 37.7759; longitude: -122.4184"
        animation="property: scale; dir: alternate; dur: 1200; loop: true; to: 6 6 6"
      ></a-entity>
    </a-scene>

    <!-- Main JavaScript file for additional behavior -->
    <script src="js/main.js"></script>

</body>
</html>
